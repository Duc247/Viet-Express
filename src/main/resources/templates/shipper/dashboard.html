<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{shipper/layout-shipper}">

<head>
    <title>Bảng điều khiển</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* Background */
        .dashboard-wrapper {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 30%, #eef2ff 60%, #f5f3ff 100%);
            position: relative;
            overflow: hidden;
            padding: 1.5rem;
        }

        .dashboard-wrapper::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            color: #1f2937;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #e5e7eb;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-card-header {
            padding: 1.5rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .stat-card-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 128px;
            height: 128px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
            transform: translate(50%, -50%);
        }

        .stat-content {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-info {
            flex: 1;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 3rem;
            line-height: 1;
            transition: all 0.3s;
        }

        .stat-icon-box {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover .stat-icon-box {
            transform: rotate(-6deg) scale(1.1);
        }

        .stat-icon-box i {
            font-size: 2rem;
            color: white;
        }

        .stat-card-footer {
            padding: 1rem 1.5rem;
            background: white;
        }

        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .action-link:hover {
            gap: 1rem;
        }

        .action-link i {
            font-size: 1rem;
        }

        /* Stat Card Colors */
        .stat-card-red .stat-card-header {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
        }

        .stat-card-red .action-link {
            color: #dc2626;
            background: #fee2e2;
        }

        .stat-card-red .action-link:hover {
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }

        .stat-card-blue .stat-card-header {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        }

        .stat-card-blue .action-link {
            color: #2563eb;
            background: #dbeafe;
        }

        .stat-card-blue .action-link:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .stat-card-green .stat-card-header {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        }

        .stat-card-green .action-link {
            color: #059669;
            background: #d1fae5;
        }

        .stat-card-green .action-link:hover {
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
        }

        .info-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .info-header {
            padding: 1.5rem;
            background: white;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .info-header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .info-header-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-header-icon i {
            font-size: 1.25rem;
        }

        .info-header-title {
            font-size: 1.125rem;
        }

        .view-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            color: #64748b;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            transition: all 0.3s;
        }

        .view-all-btn:hover {
            color: #1f2937;
            border-color: #94a3b8;
        }

        .view-all-btn i {
            font-size: 0.875rem;
        }

        /* Info Card Colors */
        .info-card-red .info-header-icon {
            background: #fee2e2;
            color: #dc2626;
        }

        .info-card-red .info-header-title {
            color: #dc2626;
        }

        .info-card-blue .info-header-icon {
            background: #dbeafe;
            color: #2563eb;
        }

        .info-card-blue .info-header-title {
            color: #2563eb;
        }

        .info-body {
            padding: 2.5rem;
        }

        .info-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 200px;
        }

        .display-icon {
            width: 80px;
            height: 80px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .display-icon i {
            font-size: 2.5rem;
            color: #94a3b8;
        }

        .display-text {
            font-size: 1rem;
            color: #64748b;
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: #f8fafc;
        }

        .data-table th {
            padding: 1rem 1.5rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table tbody td {
            padding: 3rem 1.5rem;
            text-align: center;
            color: #64748b;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .dashboard-wrapper {
                padding: 1rem;
            }

            .page-title {
                font-size: 1.75rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 2.5rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.5rem;
            }

            .stat-value {
                font-size: 2.25rem;
            }

            .stat-icon-box {
                width: 56px;
                height: 56px;
            }

            .stat-icon-box i {
                font-size: 1.75rem;
            }

            .display-icon {
                width: 64px;
                height: 64px;
            }

            .display-icon i {
                font-size: 2rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="dashboard-wrapper">
            <div class="dashboard-container">
                <!-- Page Header -->
                <div class="page-header">
                    <h2 class="page-title">Bàn làm việc quản lý</h2>
                </div>

                <!-- Statistics Cards -->
                <div class="stats-grid">
                    <!-- Yêu cầu mới -->
                    <div class="stat-card stat-card-red">
                        <div class="stat-card-header">
                            <div class="stat-content">
                                <div class="stat-info">
                                    <div class="stat-label">Yêu cầu mới</div>
                                    <div class="stat-value" th:text="${totalRequests ?: 0}">0</div>
                                </div>
                                <div class="stat-icon-box">
                                    <i class="fas fa-bell"></i>
                                </div>
                            </div>
                        </div>
                        <div class="stat-card-footer">
                            <a href="/staff/requests" th:href="@{/staff/requests}" class="action-link">
                                <span>Xử lý ngay</span>
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Đơn hàng đang giao -->
                    <div class="stat-card stat-card-blue">
                        <div class="stat-card-header">
                            <div class="stat-content">
                                <div class="stat-info">
                                    <div class="stat-label">Đơn hàng đang giao</div>
                                    <div class="stat-value" th:text="${totalParcels ?: 0}">0</div>
                                </div>
                                <div class="stat-icon-box">
                                    <i class="fas fa-truck-moving"></i>
                                </div>
                            </div>
                        </div>
                        <div class="stat-card-footer">
                            <a href="/staff/parcels" th:href="@{/staff/parcels}" class="action-link">
                                <span>Xem chi tiết</span>
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Tài xế sẵn sàng -->
                    <div class="stat-card stat-card-green">
                        <div class="stat-card-header">
                            <div class="stat-content">
                                <div class="stat-info">
                                    <div class="stat-label">Tài xế sẵn sàng</div>
                                    <div class="stat-value" th:text="${totalShippers ?: 0}">0</div>
                                </div>
                                <div class="stat-icon-box">
                                    <i class="fas fa-user-check"></i>
                                </div>
                            </div>
                        </div>
                        <div class="stat-card-footer">
                            <a href="/staff/shippers" th:href="@{/staff/shippers}" class="action-link">
                                <span>Xem danh sách</span>
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Info Grid -->
                <div class="info-grid">
                    <!-- Yêu cầu cần duyệt gấp -->
                    <div class="info-card info-card-red">
                        <div class="info-header">
                            <div class="info-header-left">
                                <div class="info-header-icon">
                                    <i class="fas fa-exclamation-circle"></i>
                                </div>
                                <h3 class="info-header-title">Yêu cầu cần duyệt gấp</h3>
                            </div>
                            <a href="/staff/requests" th:href="@{/staff/requests}" class="view-all-btn">
                                <span>Xem tất cả</span>
                            </a>
                        </div>
                        <div class="info-body">
                            <div class="info-display">
                                <div class="display-icon">
                                    <i class="fas fa-inbox"></i>
                                </div>
                                <p class="display-text">Hiện không có yêu cầu nào cần xử lý</p>
                            </div>
                        </div>
                    </div>

                    <!-- Tiến độ giao hàng -->
                    <div class="info-card info-card-blue">
                        <div class="info-header">
                            <div class="info-header-left">
                                <div class="info-header-icon">
                                    <i class="fas fa-shipping-fast"></i>
                                </div>
                                <h3 class="info-header-title">Tiến độ giao hàng</h3>
                            </div>
                        </div>
                        <div>
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Mã đơn</th>
                                        <th>Tài xế</th>
                                        <th>Trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="3">
                                            <div class="empty-state">
                                                <div class="display-icon">
                                                    <i class="fas fa-road"></i>
                                                </div>
                                                <p class="display-text">Chưa có chuyến xe nào đang chạy</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
