<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{manager/layout-manager}">

<head>
    <title th:text="${isEdit} ? 'Sửa Tuyến Đường' : 'Thêm Tuyến Đường'">Tuyến Đường - Manager</title>
</head>

<body>

    <div layout:fragment="content">

        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">
                <i class="fas fa-route me-2"></i>
                <span th:text="${isEdit} ? 'Sửa tuyến đường' : 'Thêm tuyến đường mới'">Tuyến đường</span>
            </h1>
            <a th:href="@{/manager/routes}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>Quay lại
            </a>
        </div>

        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 fw-bold text-primary"
                    th:text="${isEdit} ? 'Chỉnh sửa thông tin tuyến đường' : 'Nhập thông tin tuyến đường'">
                    Thông tin tuyến đường
                </h6>
            </div>
            <div class="card-body">
                <!-- Form TẠO MỚI -->
                <form th:if="${!isEdit}" th:action="@{/manager/routes/create}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Điểm đi <span class="text-danger">*</span></label>
                            <select name="fromLocationId" class="form-select" required>
                                <option value="">-- Chọn điểm đi --</option>
                                <option th:each="loc : ${locations}" th:value="${loc.id}"
                                    th:text="${loc.name + ' (' + (loc.locationType?.name() ?: 'N/A') + ')'}">
                                    Location
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Điểm đến <span class="text-danger">*</span></label>
                            <select name="toLocationId" class="form-select" required>
                                <option value="">-- Chọn điểm đến --</option>
                                <option th:each="loc : ${locations}" th:value="${loc.id}"
                                    th:text="${loc.name + ' (' + (loc.locationType?.name() ?: 'N/A') + ')'}">
                                    Location
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Khoảng cách (km) <span
                                    class="text-danger">*</span></label>
                            <input type="number" name="distanceKm" class="form-control" step="0.01" min="0.1" required
                                placeholder="Ví dụ: 50.5">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Thời gian dự kiến (giờ)</label>
                            <input type="number" name="estimatedTimeHours" class="form-control" step="0.5" min="0"
                                placeholder="Ví dụ: 2.5">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Tạo cả chiều về</label>
                            <div class="form-check mt-2">
                                <input type="checkbox" name="createReverse" value="true" class="form-check-input"
                                    id="createReverse" checked>
                                <label class="form-check-label" for="createReverse">
                                    Tự động tạo tuyến chiều ngược lại
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea name="description" class="form-control" rows="2"
                            placeholder="Ghi chú về tuyến đường (tùy chọn)"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Tạo tuyến đường
                        </button>
                        <a th:href="@{/manager/routes}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>

                <!-- Form SỬA -->
                <form th:if="${isEdit}" th:action="@{/manager/routes/{id}/update(id=${route.id})}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Điểm đi</label>
                            <input type="text" class="form-control" disabled
                                th:value="${route.fromLocation?.name ?: '-'}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Điểm đến</label>
                            <input type="text" class="form-control" disabled
                                th:value="${route.toLocation?.name ?: '-'}">
                        </div>
                    </div>
                    <div class="alert alert-warning mb-3">
                        <i class="fas fa-info-circle me-1"></i>
                        Không thể thay đổi điểm đi/đến. Nếu cần, hãy xóa và tạo tuyến mới.
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Khoảng cách (km) <span
                                    class="text-danger">*</span></label>
                            <input type="number" name="distanceKm" class="form-control" step="0.01" min="0.1" required
                                th:value="${route.distanceKm}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Thời gian dự kiến (giờ)</label>
                            <input type="number" name="estimatedTimeHours" class="form-control" step="0.5" min="0"
                                th:value="${route.estimatedTimeHours}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <div class="form-check mt-2">
                                <input type="checkbox" name="isActive" value="true" class="form-check-input"
                                    id="isActive" th:checked="${route.isActive}">
                                <label class="form-check-label" for="isActive">Hoạt động</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea name="description" class="form-control" rows="2"
                            th:text="${route.description}"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Lưu thay đổi
                        </button>
                        <a th:href="@{/manager/routes}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Info -->
        <div class="alert alert-info mt-4" th:if="${!isEdit}">
            <i class="fas fa-lightbulb me-2"></i>
            <strong>Mẹo:</strong> Khi tạo tuyến đường, hệ thống sẽ tự động cập nhật phí vận chuyển cho
            tất cả đơn hàng có cùng điểm gửi/nhận mà chưa được tính phí.
        </div>
    </div>

</body>

</html>
